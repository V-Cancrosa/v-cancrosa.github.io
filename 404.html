<title>V Cancrosa</title>
<script>
  // Zły adres na domenie: popraw wielkość liter w nazwie strony (np. /v_cancrosa_entertainment/ → /V_Cancrosa_Entertainment/),
  // a wszystko inne odeślij do postaci — wejścia głównego.
  (function () {
    var SITES = ["V_Cancrosa-One-and-Fursonas", "V_Cancrosa_Entertainment", "V_Cancrosa-YouTube-Create"];
    var parts = location.pathname.split("/");
    var first = (parts[1] || "").toLowerCase();
    for (var i = 0; i < SITES.length; i++) {
      if (SITES[i].toLowerCase() === first && parts[1] !== SITES[i]) {
        parts[1] = SITES[i];
        location.replace(parts.join("/") + location.search + location.hash);
        return;
      }
    }
    location.replace("/V_Cancrosa-One-and-Fursonas/");
  })();
</script>
</head>
